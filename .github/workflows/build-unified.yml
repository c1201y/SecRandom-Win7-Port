name: build(PyInstaller)

env:
  PYTHON_VERSION: "3.8"
  UV_VERSION: "latest"
  ARTIFACT_RETENTION_DAYS: 30
  CACHE_VERSION: v1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如 v1.0.0)"
        required: true
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 检出仓库
        uses: actions/checkout@v4.2.2
        with:
          lfs: true

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-x64-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-x64-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-x64-

      - name: 确定版本号
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $V = "${{ github.event.inputs.version }}"
          } else {
            $V = "${{ github.ref_name }}"
          }
          echo "version=$V" >> $env:GITHUB_OUTPUT
          echo "Version: $V"

      - name: 更新版本信息
        run: |
          python update_version.py
        env:
          VERSION: ${{ steps.get_version.outputs.version }}

      - name: 同步依赖并构建
        run: |
          uv sync --frozen
          uv run build_pyinstaller.py

      - name: 打包便携版 (zip)
        run: |
          New-Item -ItemType Directory -Force -Path zip_dist/SecRandom
          Copy-Item -Recurse -Force dist/SecRandom/* zip_dist/SecRandom/
          New-Item -ItemType Directory -Force -Path zip_dist/SecRandom/data
          Copy-Item -Recurse -Force data/* zip_dist/SecRandom/data/
          Copy-Item LICENSE zip_dist/SecRandom/data/
          New-Item -ItemType Directory -Force -Path zip
          $name = "SecRandom-Windows-Portable-${{ steps.get_version.outputs.version }}-x64.zip"
          Compress-Archive -Path zip_dist/SecRandom/* -DestinationPath "zip/$name" -Force
          echo "便携版打包完成: zip/$name"

      - name: 安装 Inno Setup 中文语言文件
        run: |
          $langPath = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/main/ChineseSimplified.isl" -OutFile $langPath

      - name: 生成安装程序 (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SRsetup.iss
          if (Test-Path "build/SecRandom setup x64.exe") {
            $setupName = "SecRandom-Windows-Setup-${{ steps.get_version.outputs.version }}-x64.exe"
            Move-Item "build/SecRandom setup x64.exe" "zip/$setupName"
            echo "安装程序生成: zip/$setupName"
          } else {
            echo "错误：Inno Setup 安装程序未生成"
            exit 1
          }

      - name: 上传 artifacts
        uses: actions/upload-artifact@v4.4.2
        with:
          name: windows-x64-pyinstaller
          path: ./zip
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    needs: [build]
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          lfs: true

      - name: 确定版本号
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 下载 artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ github.run_id }}

      - name: 准备 Release 文件
        run: |
          mkdir -p release
          mv artifacts/windows-x64-pyinstaller/* release/
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "SHA256 校验和已生成"

      - name: 生成 Release 说明
        run: |
          version="${{ steps.get_version.outputs.version }}"
          version_no_v="${version#v}"
          mkdir -p CHANGELOG/$version
          cat > CHANGELOG/$version/CHANGELOG.md << EOF
          **Windows 安装包下载**
          - 便携版 (zip): [SecRandom-Windows-Portable-$version-x64.zip](https://github.com/${{ github.repository }}/releases/download/$version/SecRandom-Windows-Portable-$version-x64.zip)
          - 安装程序 (exe): [SecRandom-Windows-Setup-$version-x64.exe](https://github.com/${{ github.repository }}/releases/download/$version/SecRandom-Windows-Setup-$version-x64.exe)

          **SHA256 校验值**
          \`\`\`
          $(cat release/SHA256SUMS.txt)
          \`\`\`
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release/*
          body_path: CHANGELOG/${{ steps.get_version.outputs.version }}/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'alpha') }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: SecRandom 新版本 - ${{ steps.get_version.outputs.version }}
