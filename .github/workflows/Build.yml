name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build_win_x64
    runs-on: windows-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        env:
          PLATFORM: Windows
        run: |
          dotnet restore SecRandom.sln -p:SecRandomPlatform=$env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw "Restore failed with exit code $LASTEXITCODE." }

      - name: Build
        shell: pwsh
        run: |
          dotnet build SecRandom.sln -c Release --no-restore -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE." }

      - name: Test
        shell: pwsh
        run: |
          dotnet test SecRandom.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE." }

      - name: Publish Desktop
        shell: pwsh
        env:
          PLATFORM: Windows
        run: |
          $outDir = 'artifacts/publish/win-x64'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $arguments = @(
            'publish', 'SecRandom.Desktop/SecRandom.Desktop.csproj',
            '-c', 'Release',
            '-r', 'win-x64',
            "-p:SecRandomPlatform=$env:PLATFORM",
            '-p:PublishTrimmed=false',
            '-p:UseAppHost=true',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '-p:BuildInParallel=false',
            '-p:UseSharedCompilation=false',
            '--no-restore',
            '--self-contained',
            '-o', $outDir
          )
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed with exit code $LASTEXITCODE." }

      - name: Verify bundled audio runtime
        shell: pwsh
        run: |
          foreach ($file in @('NAudio.Core.dll', 'NAudio.WinMM.dll', 'NLayer.dll', 'NLayer.NAudioSupport.dll')) {
            $path = Join-Path 'artifacts/publish/win-x64' $file
            if (!(Test-Path -LiteralPath $path)) {
              throw "Bundled managed audio runtime is missing: $path"
            }
            Write-Host "Verified $file"
          }

      - name: Pack Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/dist -Force | Out-Null
          Compress-Archive -Path 'artifacts/publish/win-x64/*' -DestinationPath 'artifacts/dist/SecRandom-win-x64-portable.zip' -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecRandom-win-x64-portable
          path: artifacts/dist/*.zip
